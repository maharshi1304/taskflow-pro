services:
  api:
    build:
      context: ./api-server
      dockerfile: Dockerfile

    container_name: taskflow-api

    ports:
      - "5001:5001"

    volumes:
      - taskflow-api-data:/app/data

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --quiet --spider http://localhost:5001/tasks || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile

      args:
        VITE_API_BASE_URL: http://localhost:5001

    container_name: taskflow-frontend

    ports:
      - "8080:80"

    depends_on:
      api:
        condition: service_healthy

    restart: unless-stopped

volumes:
  taskflow-api-data:
